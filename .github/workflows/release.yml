name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      # Trusted publishing needs npm 11.5+, newer than the npm bundled with Node 22.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm run verify:pack
      - run: npm publish --dry-run --provenance
      - uses: changesets/action@v2
        with:
          version-script: npm run version:packages
          publish-script: npm run release
          create-github-releases: true
          pr-title: "Version Packages"
          commit-message: "Version packages"
        env:
          NPM_CONFIG_PROVENANCE: true

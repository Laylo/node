name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      # Trusted publishing needs npm 11.5+. npm 12 dropped Node 20, so stay on 11.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm run verify:pack
      - run: npm publish --dry-run --provenance
      # v2 of the action requires Changesets CLI v3, which needs Node 22.
      # v1 supports trusted publishing as long as NPM_TOKEN is not set.
      - uses: changesets/action@v1
        with:
          version: npm run version:packages
          publish: npm run release
          createGithubReleases: true
          title: "Version Packages"
          commit: "Version packages"
        env:
          NPM_CONFIG_PROVENANCE: true

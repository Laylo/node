name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Dev tooling (Changesets v3) requires Node 22. The SDK itself still
      # supports Node 20, so install without the engine check on that leg.
      - run: npm ci --engine-strict=false
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm run verify:pack

  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -q '^src/'; then
            npx changeset status --since="origin/$BASE_REF"
          else
            echo "No src/ changes; changeset not required."
          fi
